spring.application.name=url-shortener
server.port=8080

# In-memory H2. The schema is rebuilt on every start, so links do not survive a restart.
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Browse the data at http://localhost:8080/h2-console (JDBC URL above, user "sa", no password).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Prefix used to build the short URL handed back to clients.
app.base-url=http://localhost:8080
# Characters in a generated code. 7 base62 chars is ~3.5e12 possible codes.
app.code-length=7
# Retries when a randomly generated code collides with an existing one.
app.max-code-attempts=5
app.allowed-origins=http://localhost:4200

# Token bucket per client IP, applied to /api/** only. Sized for both dashboards polling at once:
# analytics every 10s and governance every 1.5s during an active run, at 2 requests per tick.
app.rate-limit.enabled=true
app.rate-limit.capacity=120
app.rate-limit.refill-per-minute=120
app.rate-limit.max-tracked-clients=10000

# SDLC orchestration engine. Modules stand in for real delivery work, so their processing time is
# simulated rather than measured; worker-threads must cover the widest parallel stage (2 channels).
app.orchestration.max-attempts=3
app.orchestration.module-latency-ms=900
app.orchestration.worker-threads=4
app.orchestration.ledger-capacity=500
